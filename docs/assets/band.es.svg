<svg xmlns="http://www.w3.org/2000/svg" width="900" height="252" viewBox="0 0 900 252" role="img" aria-labelledby="t d">
<title id="t">banda de waypoint</title>
<desc id="d">Maqueta de la banda sobre el prompt de Claude Code en sus tres modos: diseño, trabajo y ejecución, con sus botones.</desc>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#cdd6f4}
.m{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}
.dim{fill:#a6adc8}
.faint{fill:#7f849c}
.flow{stroke-dasharray:4 6;animation:dash 1s linear infinite}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 1s linear infinite}
.blink{animation:blink 1.1s steps(1) infinite}
@keyframes dash{to{stroke-dashoffset:-20}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes blink{50%{opacity:0}}
@keyframes st{0%{opacity:0}3%{opacity:1}30.3%{opacity:1}33.3%{opacity:0}100%{opacity:0}}
.st{opacity:0;animation:st 15s infinite both}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
