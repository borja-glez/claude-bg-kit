<text x="32" y="44" font-size="20" font-weight="700">forge · cada tarea, el camino que pide su tamaño</text>
<text x="32" y="66" font-size="12.5" class="dim">el triaje lee la tarea, los ficheros que toca y las zonas sensibles, y elige un camino</text>
