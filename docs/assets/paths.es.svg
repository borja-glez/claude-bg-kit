<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470" role="img" aria-labelledby="t d">
<title id="t">forge · cada tarea, el camino que pide su tamaño</title>
<desc id="d">Diagrama del triaje de forge: una tarea va al camino Trivial, Small, Medium o Large, cada uno con su ejecutor, su validación y su revisión; debajo, la escalera de implementadores por modelo y los tres revisores.</desc>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#cdd6f4}
.m{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}
.dim{fill:#a6adc8}
.faint{fill:#7f849c}
.flow{stroke-dasharray:4 6;animation:dash 1s linear infinite}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 1s linear infinite}
.blink{animation:blink 1.1s steps(1) infinite}
@keyframes dash{to{stroke-dashoffset:-20}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes blink{50%{opacity:0}}
@keyframes st{0%{opacity:0}3%{opacity:1}22%{opacity:1}25%{opacity:0}100%{opacity:0}}
.st{opacity:0;animation:st 12s infinite both}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
