<circle cx="722" cy="380" r="7" fill="#cba6f7"/></g>
<path d="M60 142V288H150" stroke="#585b70" stroke-width="1" fill="none" class="flow"/>
<rect x="150" y="268" width="470" height="40" rx="10" fill="#181825" stroke="#313244" stroke-width="1"/>
<text x="166" y="286" font-size="12.5" style="fill:#94e2d5" font-weight="700">T008 · subagente</text>
<text x="166" y="301" font-size="10" class="m faint">.claude/worktrees/task-T008 · task/T008</text>
<rect x="370" y="284" width="150" height="8" rx="4" fill="#45475a"/><rect x="370" y="284" width="150" height="8" rx="4" fill="#94e2d5" class="g2"/>
<g class="ok2"><text x="536" y="293" font-size="11.5" class="m" style="fill:#a6e3a1">✓ integrado</text>
<path d="M620 288C700 288 672 350 672 370" stroke="#94e2d5" stroke-width="1.8" fill="none"/>
<circle cx="672" cy="380" r="7" fill="#94e2d5"/></g>
<rect x="150" y="320" width="470" height="30" rx="10" fill="none" stroke="#45475a" stroke-width="1" stroke-dasharray="4 4"/>
<text x="166" y="340" font-size="11.5" class="dim">T009 · espera a T004 · se lanza al integrarse</text>
<path d="M32 380H868" stroke="#a6e3a1" stroke-width="2.5"/>
<text x="40" y="372" font-size="12" class="m" style="fill:#a6e3a1" font-weight="700">forge/run-&lt;project&gt; · .claude/worktrees/run</text>
<text x="32" y="404" font-size="11.5" class="dim">Al final la rama de ejecución se fusiona en la tuya, con tu permiso (o el que diste al empezar).</text>
<text x="32" y="422" font-size="11.5" class="dim">Hasta swarm.parallel tareas a la vez (3 por defecto) · un merge cada vez, validadores tras cada uno comparados con lo que ya fallaba.</text>
<text x="32" y="440" font-size="11.5" class="dim">Modo subagentes o sesiones · las sesiones manuales se unen cuando quieran · se ve en el roadmap, la banda y lens.</text>
</svg>
