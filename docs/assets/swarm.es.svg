<svg xmlns="http://www.w3.org/2000/svg" width="900" height="464" viewBox="0 0 900 464" role="img" aria-labelledby="t d">
<title id="t">ejecución de forge · varias tareas a la vez</title>
<desc id="d">Diagrama de una ejecución de forge en modo subagentes: una sesión coordinadora en la rama de ejecución forge/run-proyecto, en .claude/worktrees/run, lanza un subagente implementador por tarea lista, cada uno en su worktree .claude/worktrees/task-T; cada tarea pasa por revisión y se integra en la rama de ejecución de una en una, y al final esa rama se fusiona en la tuya con tu permiso.</desc>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#cdd6f4}
.m{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}
.dim{fill:#a6adc8}
.faint{fill:#7f849c}
.flow{stroke-dasharray:4 6;animation:dash 1s linear infinite}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 1s linear infinite}
.blink{animation:blink 1.1s steps(1) infinite}
@keyframes dash{to{stroke-dashoffset:-20}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes blink{50%{opacity:0}}
@keyframes g0{0%{transform:scaleX(0.05)}42%{transform:scaleX(1)}100%{transform:scaleX(1)}}
.g0{transform-box:fill-box;transform-origin:left center;animation:g0 14s ease-in-out 0s infinite both}
@keyframes ok0{0%{opacity:0}42%{opacity:0}44%{opacity:1}96%{opacity:1}100%{opacity:0}}
.ok0{animation:ok0 14s infinite both}
@keyframes g1{0%{transform:scaleX(0.05)}62%{transform:scaleX(1)}100%{transform:scaleX(1)}}
.g1{transform-box:fill-box;transform-origin:left center;animation:g1 14s ease-in-out 1.2s infinite both}
@keyframes ok1{0%{opacity:0}70.6%{opacity:0}72.6%{opacity:1}96%{opacity:1}100%{opacity:0}}
.ok1{animation:ok1 14s infinite both}
@keyframes g2{0%{transform:scaleX(0.05)}52%{transform:scaleX(1)}100%{transform:scaleX(1)}}
.g2{transform-box:fill-box;transform-origin:left center;animation:g2 14s ease-in-out 0.5s infinite both}
@keyframes ok2{0%{opacity:0}55.6%{opacity:0}57.6%{opacity:1}96%{opacity:1}100%{opacity:0}}
.ok2{animation:ok2 14s infinite both}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect x="0" y="0" width="900" height="464" rx="18" fill="#1e1e2e"/>
<text x="32" y="44" font-size="20" font-weight="700">ejecución de forge · varias tareas a la vez</text>
<text x="32" y="66" font-size="12.5" class="dim">la coordinadora solo coordina: lanza un subagente por tarea lista e integra su trabajo en la rama de ejecución</text>
<rect x="32" y="92" width="836" height="50" rx="10" fill="#181825" stroke="#94e2d5" stroke-width="1"/>
<text x="48" y="115" font-size="13" style="fill:#94e2d5" font-weight="700">coordinadora</text>
<text x="48" y="132" font-size="11" class="dim">forge swarm tick: lanza tareas listas, revisa, integra, duerme y repite</text>
<text x="852" y="122" font-size="13" class="m" style="fill:#94e2d5" text-anchor="end">▶ ejecución · subagentes 3/3</text>
