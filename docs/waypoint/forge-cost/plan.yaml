  # F7 · Ajuste con datos reales
  - id: T019
    title: Fijar el esfuerzo de los revisores con el informe en sombra
    track: escalera
    phase: F7
    includes: >-
      Cuando la prueba haya gastado sus 10 briefs, guardar la salida de FORGE shadow report en
      docs/waypoint/forge-cost/medidas/sombra.md con la decisión de la persona por revisor: high se queda si recupera al
      menos el 90 % de los bloqueantes de su gemelo y no pierde ningún critical; si no, ese revisor vuelve a xhigh por
      defecto en reviewFor (una línea) y su test lo fija. Los bundles van en la siguiente versión.
    done_when: >-
      medidas/sombra.md tiene el informe con remaining 0 y una decisión por revisor tomada por la persona, y
      tests/forge-triage.test.ts en verde con la tabla que dice ese fichero.
    verification: npx vitest run tests/forge-triage.test.ts
    depends_on: [T018]
    zones: ["docs/waypoint/forge-cost/medidas/sombra.md", "src/forge/triage.ts", "tests/forge-triage.test.ts"]
    estimate_min: 40
