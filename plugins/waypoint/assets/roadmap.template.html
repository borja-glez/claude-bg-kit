<title>__TITLE__</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>:root{--crust:#11111b;--mantle:#181825;--base:#1e1e2e;--s0:#313244;--s1:#45475a;--s2:#585b70;--o0:#6c7086;--o1:#7f849c;--sub0:#a6adc8;--sub1:#bac2de;--text:#cdd6f4;
  --lavender:#b4befe;--blue:#89b4fa;--sapphire:#74c7ec;--sky:#89dceb;--teal:#94e2d5;--green:#a6e3a1;--yellow:#f9e2af;--peach:#fab387;--red:#f38ba8;--mauve:#cba6f7;--pink:#f5c2e7;--flamingo:#f2cdcd;
  --done:var(--sapphire);--cur:var(--peach);--blk:var(--yellow);--now:var(--red);--rh:28px;
  --mute:#868ba3;--t-peach:var(--peach);--t-yellow:var(--yellow);--t-green:var(--green);--t-blue:var(--blue);--t-lav:var(--lavender);--t-teal:var(--teal);--t-red:var(--red);--t-mauve:var(--mauve);--t-pink:var(--pink);--t-sapphire:var(--sapphire);--t-sky:var(--sky);--t-flamingo:var(--flamingo);
  --on-lav:#11111b;--on-peach:#11111b;--on-red:#11111b;--on-teal:#11111b;--on-yellow:#11111b;color-scheme:dark}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){--crust:#dce0e8;--mantle:#e6e9ef;--base:#eff1f5;--s0:#ccd0da;--s1:#bcc0cc;--s2:#acb0be;--o0:#9ca0b0;--o1:#8c8fa1;--sub0:#62657b;--sub1:#5c5f77;--text:#4c4f69;
  --lavender:#7287fd;--blue:#1e66f5;--sapphire:#209fb5;--sky:#04a5e5;--teal:#179299;--green:#40a02b;--yellow:#df8e1d;--peach:#fe640b;--red:#d20f39;--mauve:#8839ef;--pink:#ea76cb;--flamingo:#dd7878;--mute:#5c5f77;--t-peach:#a3440a;--t-yellow:#8a5a00;--t-green:#2a7020;--t-blue:#1a55c8;--t-lav:#4f5bd5;--t-teal:#0b6573;--t-red:#b0153a;--t-mauve:#7a2fd0;--t-pink:#b8336f;--t-sapphire:#0f6e80;--t-sky:#0a6a96;--t-flamingo:#a8434a;--on-lav:#11111b;--on-peach:#11111b;--on-red:#ffffff;--on-teal:#11111b;--on-yellow:#11111b;color-scheme:light}}
:root[data-theme="dark"]{color-scheme:dark}
:root[data-theme="light"]{--crust:#dce0e8;--mantle:#e6e9ef;--base:#eff1f5;--s0:#ccd0da;--s1:#bcc0cc;--s2:#acb0be;--o0:#9ca0b0;--o1:#8c8fa1;--sub0:#62657b;--sub1:#5c5f77;--text:#4c4f69;--lavender:#7287fd;--blue:#1e66f5;--sapphire:#209fb5;--sky:#04a5e5;--teal:#179299;--green:#40a02b;--yellow:#df8e1d;--peach:#fe640b;--red:#d20f39;--mauve:#8839ef;--pink:#ea76cb;--flamingo:#dd7878;--mute:#5c5f77;--t-peach:#a3440a;--t-yellow:#8a5a00;--t-green:#2a7020;--t-blue:#1a55c8;--t-lav:#4f5bd5;--t-teal:#0b6573;--t-red:#b0153a;--t-mauve:#7a2fd0;--t-pink:#b8336f;--t-sapphire:#0f6e80;--t-sky:#0a6a96;--t-flamingo:#a8434a;--on-lav:#11111b;--on-peach:#11111b;--on-red:#ffffff;--on-teal:#11111b;--on-yellow:#11111b;color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;background:var(--base);color:var(--text);font-family:'IBM Plex Sans',system-ui,sans-serif}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.shell{display:grid;grid-template-columns:84px minmax(0,1fr);min-height:calc(100dvh / var(--z,1))}
.side{background:var(--mantle);border-right:1px solid var(--s0);padding:12px 0;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;align-self:start;height:calc(100dvh / var(--z,1));overflow-y:auto;scrollbar-width:thin}
.brand{font-family:'Barlow Condensed',sans-serif;font-weight:700;color:var(--t-lav);text-align:center;font-size:13px;letter-spacing:.12em;margin-bottom:10px;padding:0 4px;overflow-wrap:anywhere}
.nav{font-family:'Barlow Condensed',sans-serif;font-size:12px;letter-spacing:.1em;text-align:center;padding:10px 2px;color:var(--mute);text-transform:uppercase}
.nav b{display:block;font-size:18px;margin-bottom:2px}
.nav.on{color:var(--text);background:var(--s0);box-shadow:inset 3px 0 var(--peach)}
.nav .ns{display:none}
.nav .nl{display:block;line-height:1.2}
.main{padding:18px 20px;min-width:0}
/* §4.7: the focus lands on the view (tabindex="-1") when what opened a closed detail is gone; no ring around the view */
.main:focus{outline:none}
/* ---- The status strip (§4.6): one line, sticky over every view ---- */
.strip{position:sticky;top:0;z-index:15;display:flex;flex-wrap:wrap;align-items:center;gap:4px 14px;margin:-18px -20px 12px;padding:8px 20px;background:var(--base);border-bottom:1px solid var(--s0);font:12px 'JetBrains Mono',monospace;color:var(--sub0)}
.strip .live{font-size:12px}
.strip .pill{margin-top:0;vertical-align:middle}
.strip .sv{color:var(--t-lav);font-weight:600}
.strip .sdl{color:var(--t-blue);text-decoration:none;border-bottom:1px dotted currentColor}
.pill.inf.warn{color:var(--t-yellow)} .pill.inf.stopped{color:var(--t-red)}
.live{font-family:'Barlow Condensed',sans-serif;color:var(--t-green);letter-spacing:.14em;font-size:12px}
.live.off{color:var(--t-yellow)}
h1{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:34px;margin:0 0 2px;text-transform:uppercase;letter-spacing:.02em}
.meta,.mono,.kv{font-family:'JetBrains Mono',monospace;font-size:12.5px;color:var(--sub0);line-height:1.6}
.meta b,.kv dd{color:var(--t-lav)}
.lbl{font-family:'Barlow Condensed',sans-serif;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);margin-bottom:4px}
.muted{color:var(--mute);font-size:13px}
.row3{display:grid;grid-template-columns:1.15fr 1fr 1.1fr;gap:12px;margin-top:14px}
.card{background:var(--mantle);border:1px solid var(--s0);border-radius:8px;padding:12px;min-width:0}
/* The detail's title, scoped to its header: `t` is also the time of an activity entry (review M4). */
.mh .t{font-family:'Barlow Condensed',sans-serif;font-size:19px;font-weight:600}
.mh .t em{color:var(--t-peach);font-style:normal}
.big{font-family:'Barlow Condensed',sans-serif;font-size:42px;font-weight:700;line-height:1}
.bar{height:5px;background:var(--s0);margin-top:7px;border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--cur)}
.bar.c i{background:var(--done)}
.bar.over i{background:var(--red)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;margin:8px 0 0}
.kv dt{color:var(--mute)} .kv dd{margin:0;text-align:right}
.btn{display:inline-block;font-family:'Barlow Condensed',sans-serif;font-size:12px;letter-spacing:.1em;border:1px solid var(--s1);border-radius:4px;padding:3px 8px;margin-top:8px;color:var(--sub1);text-transform:uppercase}
.btn:hover,.chip:hover{border-color:var(--lavender);color:var(--text)}
.events{list-style:none;margin:0;padding:0;font-size:13.5px}
.events li{padding:0}
.ev-done{color:var(--t-green)} .ev-blocked{color:var(--t-yellow)} .ev-started,.ev-claimed{color:var(--t-peach)} .ev-note{color:var(--t-lav)} .ev-plan_changed{color:var(--t-blue)}
.ok{color:var(--t-green)} .del{color:var(--t-red)}
.tag{font-family:'JetBrains Mono',monospace;font-size:10.5px;padding:1px 6px;border-radius:3px;font-weight:600;background:color-mix(in srgb,currentColor 16%,transparent)}
.c-blue{color:var(--t-blue)} .c-mauve{color:var(--t-mauve)} .c-teal{color:var(--t-teal)} .c-pink{color:var(--t-pink)} .c-sky{color:var(--t-sky)} .c-flamingo{color:var(--t-flamingo)}
.sess{margin-top:12px}
.s{background:var(--mantle);border:1px solid var(--s0);border-radius:8px;padding:8px 10px}
.s .n{font-family:'Barlow Condensed',sans-serif;font-size:15px;font-weight:600}
.s .dot{color:var(--t-green)}
.tabs{display:flex;gap:6px;margin-top:16px;align-items:center;flex-wrap:wrap}
.tab{font-family:'Barlow Condensed',sans-serif;font-size:13px;letter-spacing:.1em;padding:5px 12px;border:1px solid var(--s0);border-radius:4px;color:var(--mute);text-transform:uppercase}
.tab.on{color:var(--text);background:var(--s0);border-color:var(--lavender)}
.search{background:var(--mantle);border:1px solid var(--s0);border-radius:4px;color:var(--text);padding:5px 9px;font:12px 'JetBrains Mono',monospace;min-width:160px}
.zoom{margin-left:auto;display:flex;gap:2px;flex-wrap:wrap}
.zoom button{font-family:'Barlow Condensed',sans-serif;font-size:12px;padding:5px 10px;color:var(--mute);border:1px solid var(--s0);border-radius:3px}
.zoom button.on{background:var(--lavender);color:var(--on-lav)}
.tlw{margin-top:8px;border:1px solid var(--s0);border-radius:10px;background:var(--mantle);max-height:min(calc(72dvh / var(--z,1)),960px);overflow:auto;overscroll-behavior-x:contain;scrollbar-width:thin}
.tlw:focus-visible{outline:2px solid var(--lavender);outline-offset:2px}
.tl{display:grid;grid-template-columns:clamp(150px,28%,340px) minmax(0,1fr)}
.tl .l{border-right:1px solid var(--s0);min-width:0}
.tl .r{position:relative;min-width:0;overflow:clip;cursor:grab;user-select:none;touch-action:pan-y}
.tl .r:active{cursor:grabbing}
.tr,.rr{height:var(--rh);border-bottom:1px solid var(--base)}
.vpad{pointer-events:none}
.tr{display:flex;align-items:center;gap:7px;width:100%;padding:0 10px;font-size:13px;text-align:left;cursor:pointer;white-space:nowrap;overflow:hidden}
.tr:hover,.rr:hover{background:color-mix(in srgb,var(--s0) 45%,transparent)}
.tr.axis,.ticks{height:26px;cursor:default;position:sticky;top:0;z-index:3;background:var(--mantle)}
.tr.ph{font-family:'Barlow Condensed',sans-serif;font-weight:600;letter-spacing:.06em;text-transform:none;font-size:14px}
.tr.ph .pn{text-transform:uppercase}
.tr.ph,.rr.ph{position:sticky;top:26px;z-index:2;background:linear-gradient(color-mix(in srgb,var(--s0) 30%,transparent),color-mix(in srgb,var(--s0) 30%,transparent)),var(--mantle)}
.tr .chev{width:10px;color:var(--mute)}
.tr .mini{flex:0 0 44px;height:4px;border-radius:2px;background:var(--s0);overflow:hidden;margin-left:auto}
.tr .mini i{display:block;height:100%;background:var(--done)}
.tr .sd{flex:0 0 7px;height:7px;border-radius:50%;background:currentColor}
.tr.tk{padding-left:24px;color:var(--sub1)}
.tr .lab{overflow:hidden;text-overflow:ellipsis}
.tr .c{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--mute)}
.k{font-family:'JetBrains Mono',monospace;color:var(--mute);font-size:11.5px}
.ticks{border-bottom:1px solid var(--s0)}
.ticks span{position:absolute;top:6px;transform:translateX(-50%);font:11px 'JetBrains Mono',monospace;color:var(--sub0);white-space:nowrap}
.ticks span.edge-l{transform:none}
.ticks span.edge-r{transform:translateX(-100%)}
.ticks span.near-now{visibility:hidden}
.grid{position:absolute;inset:26px 0 0 0;pointer-events:none}
.grid i{position:absolute;top:0;bottom:0;width:1px;background:color-mix(in srgb,var(--s0) 55%,transparent)}
.rr{position:relative}
.gb{position:absolute;top:9px;height:12px;border-radius:6px;cursor:pointer;transition:filter .15s}
.gb:hover{filter:brightness(1.18);box-shadow:0 0 0 2px color-mix(in srgb,var(--text) 25%,transparent)}
.rr.ph .gb{top:10px;height:10px;opacity:.75}
.gb.done{background:var(--done)} .gb.blocked{background:var(--blk)} .gb.estimate{border:1px dashed var(--s2);background:color-mix(in srgb,var(--s1) 18%,transparent)}
.gb.current{background:repeating-linear-gradient(-45deg,var(--cur) 0 6px,color-mix(in srgb,var(--cur) 78%,var(--base)) 6px 12px);background-size:17px 17px;animation:flow 1.2s linear infinite}
@keyframes flow{to{background-position:17px 0}}
@media (prefers-reduced-motion:reduce){.gb.current{animation:none}}
.gl{position:absolute;top:7px;font-size:12px;color:var(--sub0);white-space:nowrap;pointer-events:none;overflow:hidden;text-overflow:ellipsis}
/* The timeline's now marker, scoped to the timeline: Summary's «En curso» is a `.card.now` (carry 10a). */
.tl .now{position:absolute;top:0;bottom:0;width:2px;background:var(--now);z-index:4;box-shadow:0 0 8px color-mix(in srgb,var(--now) 60%,transparent);pointer-events:none}
.tl .now span{position:sticky;top:4px;display:inline-block;margin-left:4px;font:10px 'Barlow Condensed',sans-serif;letter-spacing:.1em;background:var(--now);color:var(--on-red);padding:0 4px;border-radius:2px}
.legend{display:flex;gap:14px;margin-top:8px;font-size:12px;align-items:center;color:var(--mute);flex-wrap:wrap}
.lg{display:inline-block;width:14px;height:8px;margin-right:6px;vertical-align:middle;border-radius:4px}
.legend .hint{margin-left:auto;color:var(--mute);font-size:11.5px}
.scale{display:flex;gap:4px;justify-content:center;margin-top:auto;padding-top:10px}
.scale button{font:600 12px 'Barlow Condensed',sans-serif;color:var(--mute);border:1px solid var(--s0);border-radius:4px;padding:3px 7px}
.scale button:hover{color:var(--text);border-color:var(--lavender)}
.lg.done{background:var(--done)} .lg.current{background:var(--cur)} .lg.blocked{background:var(--blk)} .lg.estimate{border:1px dashed var(--s2)} .lg.nowl{background:var(--now);width:2px}
.overlay{position:fixed;inset:0;background:color-mix(in srgb,var(--crust) 80%,transparent);display:flex;align-items:flex-start;justify-content:center;padding:6dvh 16px;overflow:auto;z-index:40;overscroll-behavior:contain}
.modal{background:var(--base);border:1px solid var(--s1);border-radius:12px;padding:18px 20px;max-width:900px;width:100%}
.mh{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;position:sticky;top:0;z-index:2;background:var(--base);margin:-18px -20px 0;padding:18px 20px 10px;border-radius:12px 12px 0 0;border-bottom:1px solid var(--s0)}
.mh>div:first-child{min-width:0;overflow-wrap:anywhere}
html.wp-modal,html.wp-modal body{overflow:hidden}
.mh .btn{margin:0}
.mhb{display:flex;gap:6px;align-items:flex-start;flex:0 0 auto}
.pill{display:inline-block;font-family:'Barlow Condensed',sans-serif;font-size:11px;letter-spacing:.08em;padding:2px 8px;border-radius:3px;border:1px solid currentColor;text-transform:uppercase;margin-top:6px}
.st-done{color:var(--t-sapphire)} .st-in_progress,.st-claimed{color:var(--t-peach)} .st-blocked{color:var(--t-yellow)} .st-free,.st-orphaned{color:var(--mute)}
.sec{margin-top:10px;font-size:13px;color:var(--sub1)}
.chip{font:11px 'JetBrains Mono',monospace;border:1px solid var(--s1);border-radius:3px;padding:1px 6px}

.nav{display:block;width:100%}
.ev-message{color:var(--t-mauve)}
.sessions-view{margin-top:14px}
/* Every auto-fill grid takes columns no wider than its box: at 390 px none of them widens the page (carry 10b). */
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(280px,100%),1fr));gap:12px}
.sc{background:var(--mantle);border:1px solid var(--s0);border-radius:8px;padding:12px;min-width:0}
.sc.warn,.s.warn{border-color:var(--yellow)}
.sc.idle{opacity:.6}
.sc h3{font-family:'Barlow Condensed',sans-serif;font-size:20px;margin:0;display:flex;align-items:center;gap:8px}
.sc .dot{color:var(--t-green)} .sc.idle .dot{color:var(--mute)}
.sc .kv dd{text-align:left;overflow-wrap:anywhere}
.pe{color:var(--t-peach)} .ye{color:var(--t-yellow)}
.thread{margin-top:10px;border-top:1px solid var(--s0);padding-top:8px}
.msg{font-size:11.5px;padding:6px 8px;border-radius:5px;background:var(--base);margin-bottom:5px;border-left:3px solid currentColor;color:var(--sub1);overflow-wrap:anywhere}
.msg .who{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--mute);display:block;margin-bottom:2px}
.msg.c-mauve{border-left-color:var(--mauve)} .msg.c-peach{border-left-color:var(--peach)} .msg.c-teal{border-left-color:var(--teal)} .msg.c-blue{border-left-color:var(--blue)} .msg.c-yellow{border-left-color:var(--yellow)}

/* plan view */
select,textarea{font:inherit;color:var(--text);background:var(--mantle);border:1px solid var(--s1);border-radius:4px}
select{padding:1px 4px;font-size:11px;max-width:100%}
.f{font-family:'Barlow Condensed',sans-serif;font-size:12px;letter-spacing:.08em;padding:4px 10px;border:1px solid var(--s1);border-radius:4px;text-transform:uppercase;color:var(--sub0)}
.f.on{background:color-mix(in srgb,currentColor 16%,transparent)}
.f.trk{margin-left:auto;display:flex;align-items:center;gap:6px;max-width:100%;min-width:0}
.f.trk select{max-width:100%;min-width:0;flex:1 1 auto}
.pill.ph-done{color:var(--t-sapphire)} .pill.ph-in_progress{color:var(--t-peach)} .pill.ph-committed{color:var(--t-lav)} .pill.ph-provisional{color:var(--mute)}
.seg{display:flex;flex:0 0 64px;height:6px;border-radius:3px;overflow:hidden;gap:1px;background:var(--s0)}
.seg i{display:block;min-width:2px}
.seg .st-done{background:var(--done)} .seg .st-in_progress{background:var(--cur)} .seg .st-blocked{background:var(--blk)} .seg .st-free{background:var(--s1)}
/* notes view */
.nt-decision{color:var(--t-peach)} .nt-idea{color:var(--t-sapphire)} .nt-debt{color:var(--t-red)} .nt-question{color:var(--t-mauve)}
.nb-decision{border-left-color:var(--peach)!important} .nb-idea{border-left-color:var(--sapphire)!important} .nb-debt{border-left-color:var(--red)!important} .nb-question{border-left-color:var(--mauve)!important}
.ncomp{display:flex;gap:6px;margin-top:12px;align-items:flex-start;flex-wrap:wrap}
.ncomp textarea{flex:1;min-width:0;min-height:38px;padding:8px 10px;font-size:12.5px;resize:vertical}
.ncomp .btn{margin:0;display:flex;align-items:center;gap:4px;min-height:32px}
.ncomp.ro textarea{opacity:.6}
.btn.pri{background:var(--lavender);color:var(--on-lav);border-color:var(--lavender)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.notice{margin-top:6px;font-size:12px;color:var(--t-yellow)}
.notice:empty{margin-top:0}
.note{background:var(--mantle);border:1px solid var(--s0);border-left:3px solid var(--s1);border-radius:6px;padding:10px;min-width:0}
.note .nh{font-family:'Barlow Condensed',sans-serif;font-size:11px;letter-spacing:.12em;text-transform:uppercase;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.note .nh .k{text-transform:none;letter-spacing:0}
.note p{margin:5px 0 0;font-size:12.5px;color:var(--sub1);line-height:1.45;white-space:pre-wrap;overflow-wrap:anywhere}
.note .chip{margin-top:6px}
.nauto{font:10px 'JetBrains Mono',monospace;letter-spacing:0;text-transform:none;border:1px solid var(--peach);color:var(--t-peach);border-radius:3px;padding:0 4px;margin-left:4px}
.ndec{margin-top:6px;font-size:12px;color:var(--sub1);display:flex;flex-direction:column;gap:2px;overflow-wrap:anywhere}
.ndec .k{margin-right:4px}
.ans{margin-top:8px;padding:6px 8px;border-radius:5px;background:var(--base);font-size:12px;color:var(--sub1);white-space:pre-wrap;overflow-wrap:anywhere}
.ans .k{display:block;margin-bottom:2px}
.areply{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.areply textarea{padding:6px 8px;font-size:12px;resize:vertical}
.areply .btn{align-self:flex-end;margin:0}
.mnote{border-left:3px solid var(--s1);padding:2px 0 2px 8px;margin-bottom:6px;white-space:pre-wrap;overflow-wrap:anywhere}
.ev-notefeed b{font-weight:600}
/* proposals view */
.nav .badge{display:inline-block;margin-left:3px;min-width:16px;padding:0 4px;border-radius:8px;background:var(--peach);color:var(--on-peach);font-size:10px;letter-spacing:0;line-height:16px}
.pfil{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap;align-items:center}
.pfil .lbl{margin:0 4px 0 0;min-width:64px}
.prop h3{font-family:'Barlow Condensed',sans-serif;font-size:18px;font-weight:600;margin:6px 0 2px;overflow-wrap:anywhere}
.prop .nh{justify-content:flex-start;align-items:center}
.prop .nh .k{margin-left:auto}
.prop .pill{margin-top:0}
.prop .lbl{margin:8px 0 2px}
.prop.pr-low{border-left-color:var(--green)} .prop.pr-medium{border-left-color:var(--yellow)} .prop.pr-high{border-left-color:var(--red)}

.pr:hover{background:var(--base)}
.pr .st{font:600 10.5px 'Barlow Condensed',sans-serif;letter-spacing:.08em;text-transform:uppercase;padding:1px 6px;border-radius:3px;background:color-mix(in srgb,currentColor 16%,transparent)}
.pr .tt{flex:1 1 200px;min-width:0;overflow-wrap:anywhere;color:var(--text)}
.pr .fm{font:11px 'JetBrains Mono',monospace;color:var(--sub0)}
.pr .fm.del{color:var(--t-red)}
@media (pointer:coarse){.pr,.plh{min-height:40px}}

/* ---- Runs (§4.6.5; G-07) ---- */
.card.runa,.card.rhist{margin-top:12px}
.warnbox .hint{margin-top:2px;font:11.5px 'JetBrains Mono',monospace;color:var(--sub0)}
.rhl,.rtl{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column}
.rhi{border-bottom:1px solid var(--s0)}
.rhi:last-child{border-bottom:0}
.rhb{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 8px;width:100%;padding:7px 4px;text-align:left;font-size:13px;color:var(--sub1)}
.rhb:hover,button.rtb:hover{background:var(--base)}
.rhb:focus-visible,.rtb:focus-visible{outline:2px solid var(--lavender);outline-offset:-2px}
.rhb .chev{width:10px;color:var(--mute)}
/* A run id of up to 120 characters with no break point wraps instead of widening a 390 px page. */
.rhb .k,.rhb .mono{min-width:0;overflow-wrap:anywhere}
.rk{font:600 12px 'Barlow Condensed',sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--t-lav)}
.rk-single{color:var(--t-teal)} .rk-ephemeral{color:var(--t-mauve)}
.rhd{padding:4px 8px 10px 22px}
.rhd .kv{grid-template-columns:auto minmax(0,1fr)}
.rhd .kv dd{text-align:left;overflow-wrap:anywhere}
.rtl{gap:2px}
.rtb{display:block;width:100%;padding:3px 4px;border-radius:4px;text-align:left;font-size:12.5px;color:var(--sub1);overflow-wrap:anywhere}
.rs-integrated{color:var(--t-green)} .rs-blocked,.rs-conflict{color:var(--t-yellow)} .rs-stopped{color:var(--t-red)}
@media (pointer:coarse){.rhb,button.rtb{min-height:40px}}

/* ---- Sessions (§4.6.6; G-04, G-10, H-23) ---- */
.sgrp{margin-top:12px}
.sgrp>summary,.sidle>summary{cursor:pointer;padding:4px 0}
.sgrp>summary .lbl{display:inline;margin:0}
.sgrp>summary:focus-visible,.sidle>summary:focus-visible{outline:2px solid var(--lavender);outline-offset:2px}
.sgrp>.sgrid{margin-top:6px}
.sidle{margin-top:10px}
.sidle>summary{font:600 12px 'Barlow Condensed',sans-serif;letter-spacing:.08em;color:var(--mute)}
.stk{display:flex;align-items:baseline;gap:6px;margin-bottom:2px;overflow-wrap:anywhere}
.slots{list-style:none;margin:4px 0 0;padding:0;display:flex;flex-direction:column;gap:3px}
.slots .sl{font-size:12px;overflow-wrap:anywhere}
.slots .sl .mono{display:block}

/* ---- Conversation (§4.6.7; G-17, H-17) ---- */
/* One list of notes and proposals; a column never wider than a 390 px screen (carry 10b). */
.tlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(320px,100%),1fr));gap:10px;margin-top:12px;align-items:start}
.note[tabindex]:focus-visible{outline:2px solid var(--lavender);outline-offset:2px}
.note p code{font:11.5px 'JetBrains Mono',monospace;background:var(--s0);border-radius:3px;padding:0 4px}
.ans.res{border-left:3px solid var(--done)}
.ans .lnk{margin-left:8px}
.phist{margin-top:8px;font-size:12px;color:var(--sub1)}
.phist ul{margin:2px 0 0;padding-left:16px}
/* The proposal's own reason, apart from the line the owner's mark vouches for (review Minor 2). */
.prsn{margin-top:6px;font-size:12px;color:var(--sub1);white-space:pre-wrap;overflow-wrap:anywhere}
.prop .nh .chip{margin:0}
@media (max-width:760px){.tlist{grid-template-columns:1fr}}
